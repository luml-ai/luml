[project]
name = "df-model-server"
version = "0.2.0"
description = "Sample model server for satellite"
requires-python = ">=3.13"
dependencies = [
    "uvicorn==0.30.6",
    "httpx==0.27.2",
    "fnnx",
    "cloudpickle",
    "numpy",
    "onnxruntime",
    "pydantic",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.14.5,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
indent-width = 4
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "ANN", "C4", "SIM", "TID252"
]
ignore = [
    "ANN002", # *args
    "ANN003", # **kwargs
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["clients", "handlers", "services", "utils"]
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.13"
strict = false
explicit_package_bases = true
ignore_missing_imports = true
files = [
    "clients",
    "handlers",
    "services",
    "utils",
    "conda_manager.py",
    "conda_worker.py",
    "main.py",
    "openapi_generator.py",
    "server.py",
    "telemetry.py",
    "tests",
]
