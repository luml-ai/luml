name: Docker Satellite Tests and Linters

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'satellite/implementations/docker/**'
      - 'satellite/kit/**'
      - 'satellite/.env.example'
      - 'satellite/docker-compose.yml'
      - 'satellite/Caddyfile'
      - '.github/workflows/publish-satellite-agent-image.yml'
      - '.github/workflows/*satellite-docker*tests-and-linters.yml'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'satellite/implementations/docker/**'
      - 'satellite/kit/**'
      - 'satellite/.env.example'
      - 'satellite/docker-compose.yml'
      - 'satellite/Caddyfile'
      - '.github/workflows/publish-satellite-agent-image.yml'
      - '.github/workflows/*satellite-docker*tests-and-linters.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite/implementations/docker
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest
