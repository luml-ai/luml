name: Experiment Snapshots End-to-End

# The full-stack suites of frontend/tests/stack: the platform (backend, Postgres, Redis, MinIO
# and Azurite, the built frontend, experiments of this SDK and of luml-sdk 0.5.0) and Flow.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      # Whole components the run builds, installs or drives, so the list cannot fall behind.
      - 'frontend/**'
      - 'extras/js/**'
      - 'backend/**'
      - 'sdk/**'
      - 'lumlflow/**'
      # The SDK and Flow install it from source (tool.uv.sources).
      - 'relay/**'
      - 'dev/backend.env'
      - 'dev/seed.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/*experiment-snapshots*end-to-end.yml'
      - '!**/*.md'
      # Flow's web app bundles these docs (?raw imports).
      - 'lumlflow/frontend/src/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'frontend/**'
      - 'extras/js/**'
      - 'backend/**'
      - 'sdk/**'
      - 'lumlflow/**'
      - 'relay/**'
      - 'dev/backend.env'
      - 'dev/seed.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/*experiment-snapshots*end-to-end.yml'
      - '!**/*.md'
      - 'lumlflow/frontend/src/**'
  workflow_dispatch:

jobs:
  end-to-end:
    # Playwright 1.59 has no browser builds for Ubuntu 26.04: a browser cache miss fails on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [platform, flow]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Get Playwright version
        id: pw-version
        working-directory: frontend
        run: |
          VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Install Python dependencies
        run: |
          (cd sdk/python/sdk && uv sync --frozen --group dev)
          if [ "${{ matrix.suite }}" = platform ]; then (cd backend && uv sync --frozen); fi
          if [ "${{ matrix.suite }}" = flow ]; then (cd lumlflow && LUMLFLOW_BUILD_NO_FRONTEND=1 uv sync --frozen); fi

      # Released luml-sdk 0.5.0 writes the old-format experiments, as in the SDK cross-version job.
      - name: Install luml-sdk 0.5.0
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/luml-sdk-0.5.0"
          VIRTUAL_ENV="$RUNNER_TEMP/luml-sdk-0.5.0" uv pip install --exclude-newer 2026-11-15 luml-sdk==0.5.0

      - name: Run the ${{ matrix.suite }} suite
        run: frontend/tests/stack/run.sh ${{ matrix.suite }}
        env:
          CI: 'true'
          # A missing luml-sdk 0.5.0 and any skipped, flaky or not run test fail the job.
          E2E_STRICT: '1'
          E2E_OLD_SDK_PYTHON: ${{ runner.temp }}/luml-sdk-0.5.0/bin/python
          E2E_LOG_DIR: ${{ runner.temp }}/e2e-logs

      # The HTML report, screenshots and server logs; no Playwright traces in CI (they hold
      # signed storage URLs and cookies, see playwright.config.ts).
      - name: Upload the report and logs (failures only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experiment-snapshots-e2e-${{ matrix.suite }}
          path: ${{ runner.temp }}/e2e-logs/
          retention-days: 7
