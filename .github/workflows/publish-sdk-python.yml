name: Publish Python Package

on:
  push:
    tags:
      - "sdk-python/api/v*"
      - "sdk-python/sdk/v*"
      - "lumlflow/v*"
      - "luml-prisma/v*"
      - "luml-mlflow/v*"
      - "luml-relay/v*"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      package_dir: ${{ steps.release.outputs.package_dir }}
      package_init: ${{ steps.release.outputs.package_init }}
      import_name: ${{ steps.release.outputs.import_name }}
      requires_node: ${{ steps.release.outputs.requires_node }}
      gates: ${{ steps.release.outputs.gates }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve package from tag
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"

          case "$TAG" in
            sdk-python/api/v*)
              echo "package_name=luml-api" >> "$GITHUB_OUTPUT"
              echo "package_dir=sdk/python/api" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_api/__init__.py" >> "$GITHUB_OUTPUT"
              echo "import_name=luml_api" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "gates=api-client-tests" >> "$GITHUB_OUTPUT"
              ;;
            sdk-python/sdk/v*)
              echo "package_name=luml_sdk" >> "$GITHUB_OUTPUT"
              echo "package_dir=sdk/python/sdk" >> "$GITHUB_OUTPUT"
              echo "package_init=luml/__init__.py" >> "$GITHUB_OUTPUT"
              echo "import_name=luml" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "gates=sdk-tests" >> "$GITHUB_OUTPUT"
              ;;
            lumlflow/v*)
              echo "package_name=lumlflow" >> "$GITHUB_OUTPUT"
              echo "package_dir=lumlflow" >> "$GITHUB_OUTPUT"
              echo "package_init=lumlflow/__init__.py" >> "$GITHUB_OUTPUT"
              echo "import_name=lumlflow" >> "$GITHUB_OUTPUT"
              echo "requires_node=true" >> "$GITHUB_OUTPUT"
              echo "gates=lumlflow-tests lumlflow-frontend-tests" >> "$GITHUB_OUTPUT"
              ;;
            luml-prisma/v*)
              echo "package_name=luml-prisma" >> "$GITHUB_OUTPUT"
              echo "package_dir=prisma" >> "$GITHUB_OUTPUT"
              echo "package_init=src/luml_prisma/version.py" >> "$GITHUB_OUTPUT"
              echo "import_name=luml_prisma" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "gates=prisma-tests" >> "$GITHUB_OUTPUT"
              ;;
            luml-mlflow/v*)
              echo "package_name=luml-mlflow" >> "$GITHUB_OUTPUT"
              echo "package_dir=extras/python/luml-mlflow" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_mlflow/__init__.py" >> "$GITHUB_OUTPUT"
              echo "import_name=luml_mlflow" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "gates=luml-mlflow-tests" >> "$GITHUB_OUTPUT"
              ;;
            luml-relay/v*)
              echo "package_name=luml-relay" >> "$GITHUB_OUTPUT"
              echo "package_dir=relay" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_relay/__init__.py" >> "$GITHUB_OUTPUT"
              echo "import_name=luml_relay" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "gates=relay-tests" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $TAG" >&2
              exit 1
              ;;
          esac
          echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"

  api-client-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'sdk-python/api/v')
    uses: "./.github/workflows/[api-client] tests-and-linters.yml"

  sdk-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'sdk-python/sdk/v')
    uses: "./.github/workflows/[sdk] tests-and-linters.yml"

  lumlflow-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'lumlflow/v')
    uses: "./.github/workflows/[lumlflow] tests-and-linters.yml"

  lumlflow-frontend-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'lumlflow/v')
    uses: "./.github/workflows/[lumlflow-frontend] tests-and-linters.yml"

  prisma-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'luml-prisma/v')
    uses: "./.github/workflows/[prisma] tests-and-linters.yml"

  luml-mlflow-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'luml-mlflow/v')
    uses: "./.github/workflows/[luml-mlflow] tests-and-linters.yml"

  relay-tests:
    needs: resolve
    if: startsWith(github.ref_name, 'luml-relay/v')
    uses: "./.github/workflows/[relay] tests-and-linters.yml"

  publish:
    needs:
      - resolve
      - api-client-tests
      - sdk-tests
      - lumlflow-tests
      - lumlflow-frontend-tests
      - prisma-tests
      - luml-mlflow-tests
      - relay-tests
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Require the package's checks
        env:
          GATES: ${{ needs.resolve.outputs.gates }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          for gate in $GATES; do
            result=$(jq -r --arg gate "$gate" '.[$gate].result' <<< "$RESULTS")
            if [[ "$result" != "success" ]]; then
              echo "$gate finished with '$result'; not publishing." >&2
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: needs.resolve.outputs.requires_node == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set package version
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        run: |
          sed -i "s/^version = .*/version = \"${{ needs.resolve.outputs.version }}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${{ needs.resolve.outputs.version }}\"/" "${{ needs.resolve.outputs.package_init }}"

      - name: Build
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          python -m pip install --upgrade uv
          uv build --wheel

      - name: Install the wheel from the public index
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        env:
          IMPORT_NAME: ${{ needs.resolve.outputs.import_name }}
        run: |
          wheel=$(ls dist/*.whl)
          extras=$(unzip -p "$wheel" '*.dist-info/METADATA' | sed -n 's/^Provides-Extra: //p' | paste -sd, -)
          target="$wheel"
          if [[ -n "$extras" ]]; then
            target="$wheel[$extras]"
          fi
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-check"
          uv pip install --refresh --no-sources --python "$RUNNER_TEMP/wheel-check" "$target"
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import $IMPORT_NAME"

      - name: Publish
        working-directory: ${{ needs.resolve.outputs.package_dir }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          UV_PUBLISH_URL: ${{ vars.PYPI_URL }}
        run: |
          echo "Publishing ${{ needs.resolve.outputs.package_name }}@${{ needs.resolve.outputs.version }}"
          uv publish
