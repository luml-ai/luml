name: Publish Python Package

on:
  push:
    tags:
      - "sdk-python/api/v*"
      - "sdk-python/sdk/v*"
      - "lumlflow/v*"
      - "luml-prisma/v*"
      - "luml-mlflow/v*"
      - "luml-relay/v*"

jobs:
  api-tests:
    if: startsWith(github.ref_name, 'sdk-python/api/v')
    uses: "./.github/workflows/[api-client] tests-and-linters.yml"

  sdk-tests:
    if: startsWith(github.ref_name, 'sdk-python/sdk/v')
    uses: "./.github/workflows/[sdk] tests.yml"

  sdk-linters:
    if: startsWith(github.ref_name, 'sdk-python/sdk/v')
    uses: "./.github/workflows/[sdk] linters.yml"

  flow-tests:
    if: startsWith(github.ref_name, 'lumlflow/v')
    uses: "./.github/workflows/[lumlflow-python] tests-and-linters.yml"

  flow-ui-tests:
    if: startsWith(github.ref_name, 'lumlflow/v')
    uses: "./.github/workflows/[lumlflow] tests-and-linters.yml"

  prisma-tests:
    if: startsWith(github.ref_name, 'luml-prisma/v')
    uses: "./.github/workflows/[prisma] tests-and-linters.yml"

  mlflow-tests:
    if: startsWith(github.ref_name, 'luml-mlflow/v')
    uses: "./.github/workflows/[luml-mlflow] tests-and-linters.yml"

  relay-tests:
    if: startsWith(github.ref_name, 'luml-relay/v')
    uses: "./.github/workflows/[relay] tests-and-linters.yml"

  publish:
    needs: [api-tests, sdk-tests, sdk-linters, flow-tests, flow-ui-tests, prisma-tests, mlflow-tests, relay-tests]
    if: >-
      ${{ !cancelled() && (
        (startsWith(github.ref_name, 'sdk-python/api/v') && needs.api-tests.result == 'success') ||
        (startsWith(github.ref_name, 'sdk-python/sdk/v') && needs.sdk-tests.result == 'success' && needs.sdk-linters.result == 'success') ||
        (startsWith(github.ref_name, 'lumlflow/v') && needs.flow-tests.result == 'success' && needs.flow-ui-tests.result == 'success') ||
        (startsWith(github.ref_name, 'luml-prisma/v') && needs.prisma-tests.result == 'success') ||
        (startsWith(github.ref_name, 'luml-mlflow/v') && needs.mlflow-tests.result == 'success') ||
        (startsWith(github.ref_name, 'luml-relay/v') && needs.relay-tests.result == 'success')
      ) }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve package from tag
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"

          case "$TAG" in
            sdk-python/api/v*)
              echo "package_name=luml-api" >> "$GITHUB_OUTPUT"
              echo "package_dir=sdk/python/api" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_api/__init__.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            sdk-python/sdk/v*)
              echo "package_name=luml_sdk" >> "$GITHUB_OUTPUT"
              echo "package_dir=sdk/python/sdk" >> "$GITHUB_OUTPUT"
              echo "package_init=luml/__init__.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            lumlflow/v*)
              echo "package_name=lumlflow" >> "$GITHUB_OUTPUT"
              echo "package_dir=lumlflow" >> "$GITHUB_OUTPUT"
              echo "package_init=lumlflow/__init__.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=true" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            luml-prisma/v*)
              echo "package_name=luml-prisma" >> "$GITHUB_OUTPUT"
              echo "package_dir=prisma" >> "$GITHUB_OUTPUT"
              echo "package_init=src/luml_prisma/version.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            luml-mlflow/v*)
              echo "package_name=luml-mlflow" >> "$GITHUB_OUTPUT"
              echo "package_dir=extras/python/luml-mlflow" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_mlflow/__init__.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            luml-relay/v*)
              echo "package_name=luml-relay" >> "$GITHUB_OUTPUT"
              echo "package_dir=relay" >> "$GITHUB_OUTPUT"
              echo "package_init=luml_relay/__init__.py" >> "$GITHUB_OUTPUT"
              echo "requires_node=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG##*/v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported tag: $TAG" >&2
              exit 1
              ;;
          esac

      - uses: actions/setup-node@v4
        if: steps.release.outputs.requires_node == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Validate release dependencies
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: uv sync --locked --no-dev --no-install-project

      - name: Set package version
        working-directory: ${{ steps.release.outputs.package_dir }}
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.release.outputs.version }}\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"${{ steps.release.outputs.version }}\"/" "${{ steps.release.outputs.package_init }}"

      - name: Build & publish
        working-directory: ${{ steps.release.outputs.package_dir }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
          UV_PUBLISH_URL: ${{ vars.PYPI_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          echo "Publishing ${{ steps.release.outputs.package_name }}@${{ steps.release.outputs.version }}"
          uv build --wheel
          uv publish
