name: Extras JS Packages

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'extras/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sdk/python/sdk/luml/experiments/backends/exp_migrations/**'
      - 'sdk/python/sdk/tests/fixtures/experiment_snapshots/**'
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The browsers and their system packages come with the image, so no run downloads them.
    # The tag must match the locked @playwright/test version (.github/tests/test_frontend_ci.py).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      # The runner's uid owns the workspace and HOME; --ipc=host and --init as in playwright.dev/docs/docker.
      options: --user 1001 --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        package: [attachments, experiments]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: ESLint
        working-directory: extras/js/packages/${{ matrix.package }}
        run: npx eslint .

      - name: Prettier check
        working-directory: extras/js/packages/${{ matrix.package }}
        run: npm run format:check

      - name: Type check
        working-directory: extras/js/packages/${{ matrix.package }}
        run: npm run type-check

      - name: Run unit tests
        working-directory: extras/js/packages/${{ matrix.package }}
        run: npm run test:ci

      - name: Build
        working-directory: extras/js/packages/${{ matrix.package }}
        run: npm run build-only
