name: Frontend

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'frontend/**'
      - 'extras/js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'satellite/implementations/kubernetes/tests/snapshots/settings_fields.json'
      - 'sdk/python/sdk/tests/fixtures/experiment_snapshots/**'
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier check
        working-directory: frontend
        run: npm run format:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build workspace packages
        run: |
          npm run build-only --workspace=@luml/attachments
          npm run build-only --workspace=@luml/experiments

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      # Kept out of `type-check`: `npm run build` runs that script and must not depend on tests.
      - name: Type check the browser suites
        working-directory: frontend
        run: npm run type-check:tests

      - name: Run unit tests
        working-directory: frontend
        run: npm run test:ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browsers and their system packages come with the image, so no run downloads them.
    # The tag must match the locked @playwright/test version (.github/tests/test_frontend_ci.py).
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      # The runner's uid owns the workspace and HOME; --ipc=host and --init as in playwright.dev/docs/docker.
      options: --user 1001 --ipc=host --init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build workspace packages
        run: |
          npm run build-only --workspace=@luml/attachments
          npm run build-only --workspace=@luml/experiments

      - name: Build frontend
        working-directory: frontend
        run: npm run build-only

      - name: Run integration tests
        working-directory: frontend
        run: npm run test:integration
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (failures only)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7
