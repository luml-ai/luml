name: Kubernetes Satellite Tests and Linters

on:
  push:
    branches: [main]
    paths:
      - 'satellite/implementations/kubernetes/**'
      - 'satellite/kit/**'
      - 'frontend/src/components/deployments/form/DeploymentsFormSatelliteSettings.test.ts'
      - '.github/workflows/publish-kubernetes-satellite-image.yml'
      - '.github/workflows/publish-kubernetes-satellite-chart.yml'
      - '.github/workflows/*satellite-kubernetes*tests-and-linters.yml'
  pull_request:
    branches: [main]
    paths:
      - 'satellite/implementations/kubernetes/**'
      - 'satellite/kit/**'
      - 'frontend/src/components/deployments/form/DeploymentsFormSatelliteSettings.test.ts'
      - '.github/workflows/publish-kubernetes-satellite-image.yml'
      - '.github/workflows/publish-kubernetes-satellite-chart.yml'
      - '.github/workflows/*satellite-kubernetes*tests-and-linters.yml'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satellite/implementations/kubernetes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install Helm unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git --version v0.8.0

      - name: Lint Helm chart
        run: |
          helm lint chart --strict -f chart/ci/vanilla-values.yaml
          helm lint chart --strict -f chart/ci/openshift-values.yaml

      - name: Test Helm chart
        run: helm unittest --strict chart
