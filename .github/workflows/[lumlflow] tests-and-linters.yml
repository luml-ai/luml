name: Lumlflow

on:
  push:
    branches: [main]
    paths:
      - 'lumlflow/**'
      - '!lumlflow/frontend/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'lumlflow/**'
      - '!lumlflow/frontend/**'
  workflow_call:

env:
  LUMLFLOW_BUILD_NO_FRONTEND: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumlflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: lumlflow/uv.lock

      - name: Install dependencies with uv
        run: uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check lumlflow lumlflow_kernel lumlflow_typing tests

      - name: Linting
        run: uv run ruff check lumlflow lumlflow_kernel lumlflow_typing tests

      - name: Type checking
        run: uv run mypy lumlflow/flow lumlflow_kernel lumlflow_typing

      - name: Running unit tests
        run: uv run pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumlflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: lumlflow/uv.lock

      - name: Install dependencies with uv
        run: uv sync --group dev

      - name: Running integration tests
        run: uv run pytest tests/integration -n auto -m "not default_port"

      - name: Running default port tests
        run: uv run pytest tests/integration -m default_port

  # Portability is a v1 requirement, not a port at the end. The store and the
  # watcher are where the platform's differences land — atomic replace, sharing
  # violations, path legality, and events a filesystem delivers its own way.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lumlflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: lumlflow/uv.lock

      - name: Install dependencies with uv
        run: uv sync --group dev

      - name: Running store and watcher tests
        run: uv run pytest tests/unit/flow tests/integration/flow tests/integration/daemon/test_watcher.py

  # The kernel is path-injected into the workspace venv, whose floor is 3.10 —
  # so it is tested on 3.10, with no project install, exactly as it ships.
  kernel-floor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumlflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: lumlflow/uv.lock

      - name: Running kernel tests under the venv floor
        run: uv run --python 3.10 --no-project --with pytest pytest tests/unit/kernel tests/integration/kernel
