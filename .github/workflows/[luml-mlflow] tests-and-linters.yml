name: Luml MLflow Tests and Linters

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'extras/python/luml-mlflow/**'
      - 'sdk/python/sdk/**'
      - 'sdk/python/api/**'
      - '.github/workflows/*luml-mlflow*tests-and-linters.yml'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'extras/python/luml-mlflow/**'
      - 'sdk/python/sdk/**'
      - 'sdk/python/api/**'
      - '.github/workflows/*luml-mlflow*tests-and-linters.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extras/python/luml-mlflow
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --locked --group dev

      - name: Check formatting
        run: uv run --locked ruff format --check luml_mlflow tests

      - name: Linting
        run: uv run --locked ruff check luml_mlflow tests

      - name: Type checking
        run: uv run --locked mypy luml_mlflow

      - name: Running tests
        run: uv run --locked pytest
