name: Publish Relay Image

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    tags:
      - "luml-relay/image/v*"
    paths:
      - relay/Dockerfile
      - relay/pyproject.toml
      - relay/uv.lock
      - relay/luml_relay/**
  workflow_dispatch:

concurrency:
  group: publish-relay-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/luml-relay

jobs:
  tests:
    uses: "./.github/workflows/[relay] tests-and-linters.yml"

  resolve-image-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set.outputs.image_tag }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"

            if [[ ! "$TAG" =~ ^luml-relay/image/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Unsupported release tag: $TAG" >&2
              exit 1
            fi

            echo "image_tag=${TAG##*/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${{ github.ref_name }}" in
            main)
              echo "image_tag=dev" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "image_tag=staging" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "image_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported publish branch: ${{ github.ref_name }}" >&2
              exit 1
              ;;
          esac

  push-image:
    needs: [resolve-image-tag, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: relay
          file: relay/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ needs.resolve-image-tag.outputs.image_tag }}
