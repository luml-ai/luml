name: Repo Root Artifacts Check

on:
  push:
    branches: [main, staging, production]
    paths:
      - ".github/**"
  pull_request:
    branches: [main, staging, production]
  workflow_dispatch:

jobs:
  no-codie-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject codie artifacts in repo root
        run: |
          offending=$(git ls-files -- ':(glob)CODIE-*.md' 'SPEC.md' ':(glob)codie/**')
          if [ -n "$offending" ]; then
            echo "::error::Codie artifacts must not be committed to the repo root:"
            echo "$offending"
            exit 1
          fi

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Check release gates
        run: uv run --with pyyaml python -m unittest discover -s .github/tests
