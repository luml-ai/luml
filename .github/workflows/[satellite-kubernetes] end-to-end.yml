name: Kubernetes Satellite End-to-End

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'satellite/kit/**'
      - 'satellite/implementations/kubernetes/**'
      - 'model_servers/default/**'
      - '.github/workflows/*satellite-kubernetes*end-to-end.yml'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'satellite/kit/**'
      - 'satellite/implementations/kubernetes/**'
      - 'model_servers/default/**'
      - '.github/workflows/*satellite-kubernetes*end-to-end.yml'
  workflow_dispatch:

jobs:
  kind:
    name: kind (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: kubernetes-e2e-${{ github.workflow }}-${{ github.ref }}-${{ matrix.preset }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        preset: [vanilla, openshift]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'

      - name: Set up kind
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.33.0
          install_only: true

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3

      - name: Run the kind scenario
        run: bash satellite/implementations/kubernetes/e2e/run.sh "${{ matrix.preset }}"
