name: SDK

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'sdk/python/sdk/**'
      - 'skills/**'
      - '.claude-plugin/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
      - 'skills/**'
      - '.claude-plugin/**'
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: sdk/python/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/uv.lock

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run --frozen ruff format --check luml tests

      - name: Linting
        run: uv run --frozen ruff check luml tests

      - name: Type checking
        run: uv run --frozen ty check

      - name: Run unit tests
        run: uv run --frozen pytest tests --ignore=tests/integrations

      # luml-sdk 0.5.0 requires Python 3.12, the version this job runs.
      - name: Run cross-version tests against luml-sdk 0.5.0
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/luml-sdk-0.5.0"
          VIRTUAL_ENV="$RUNNER_TEMP/luml-sdk-0.5.0" uv pip install --exclude-newer 2026-11-15 luml-sdk==0.5.0
          LUML_OLD_SDK_PYTHON="$RUNNER_TEMP/luml-sdk-0.5.0/bin/python" \
            uv run --frozen pytest tests/experiments/test_metric_cross_version.py

      - name: Run integration tests
        run: uv run --frozen pytest tests/integrations

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/uv.lock

      - name: Run flow tests
        run: uv run --frozen --no-dev --extra flow --with pytest==9.0.3 pytest tests/flow

      # The export replaces its target by a rename and must write binary; both differ on Windows.
      - name: Run experiment export tests
        run: uv run --frozen --no-dev --extra flow --with pytest==9.0.3 pytest tests/artifacts/test_experiment_packaging.py
