name: SDK

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: sdk/python/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/pyproject.toml

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run --frozen ruff format --check luml tests

      - name: Linting
        run: uv run --frozen ruff check luml tests

      - name: Type checking
        run: uv run --frozen mypy luml

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/pyproject.toml

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run --frozen pytest tests --ignore=tests/integrations

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/pyproject.toml

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Run integration tests
        run: uv run --frozen pytest tests/integrations
