name: SDK

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: sdk/python/sdk

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/uv.lock

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run --frozen ruff format --check luml tests

      - name: Linting
        run: uv run --frozen ruff check luml tests

      - name: Type checking
        run: uv run --frozen mypy luml

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/uv.lock

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Run unit tests
        run: uv run --frozen pytest tests --ignore=tests/integrations

      # luml-sdk 0.5.0 requires Python 3.12, the version this job runs.
      - name: Run cross-version tests against luml-sdk 0.5.0
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/luml-sdk-0.5.0"
          VIRTUAL_ENV="$RUNNER_TEMP/luml-sdk-0.5.0" uv pip install --exclude-newer 2026-11-15 luml-sdk==0.5.0
          LUML_OLD_SDK_PYTHON="$RUNNER_TEMP/luml-sdk-0.5.0/bin/python" \
            uv run --frozen pytest tests/experiments/test_metric_cross_version.py

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: sdk/python/sdk/uv.lock

      - name: Install dependencies with uv
        run: uv sync --frozen --group dev

      - name: Run integration tests
        run: uv run --frozen pytest tests/integrations
