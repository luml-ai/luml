name: Satellite Monitoring UI

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'satellite/monitoring-ui/**'
      - 'extras/js/packages/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'satellite/monitoring-ui/**'
      - 'extras/js/packages/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_call:

defaults:
  run:
    working-directory: satellite/monitoring-ui

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci --include=optional

      - name: Type check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the committed bundle is up to date
        run: git diff --exit-code -- ../kit/luml_satellite/monitoring/dashboard/static
