name: Satellite Monitoring UI Tests and Linters

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'satellite/monitoring-ui/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'satellite/monitoring-ui/**'
  workflow_call:

defaults:
  run:
    working-directory: satellite/monitoring-ui

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: satellite/monitoring-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the committed bundle is up to date
        run: git diff --exit-code -- ../kit/luml_satellite/monitoring/dashboard/static
