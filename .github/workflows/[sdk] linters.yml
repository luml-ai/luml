name: SDK Linters

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --group dev

      - name: Check formatting
        run: uv run ruff format --check luml tests

      - name: Linting
        run: uv run ruff check luml tests

      - name: Type checking
        run: uv run mypy luml
