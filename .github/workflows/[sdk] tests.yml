name: SDK Tests

permissions:
  contents: read

on:
  push:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'sdk/python/sdk/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: sdk/python/sdk

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests --ignore=tests/integrations

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies with uv
        run: |
          python -m pip install --upgrade uv
          uv sync --group dev

      - name: Run integration tests
        run: uv run pytest tests/integrations
