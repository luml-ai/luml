name: Backend Tests and Linters

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging, production]
    paths:
      - 'backend/**'
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check luml migrations tests utils

      - name: Linting
        run: uv run ruff check luml migrations tests utils

      - name: Type checking
        run: uv run mypy luml utils tests

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_VERSION: '1'
      POSTGRESQL_DSN: postgresql+asyncpg://test_user:test_password@localhost:5432/df_studio_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET_KEY: test_secret_key_for_ci
      BUCKET_SECRET_KEY: 03MWDoMHorc-Ir2qX0F4KT9wrL3V7m5d3KRtwKEhaO0=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_VERSION: '1'
      POSTGRESQL_DSN: postgresql+asyncpg://test_user:test_password@localhost:5432/df_studio_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_SECRET_KEY: test_secret_key_for_ci
      BUCKET_SECRET_KEY: 03MWDoMHorc-Ir2qX0F4KT9wrL3V7m5d3KRtwKEhaO0=
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: df_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d df_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Run integration tests
        run: uv run pytest tests/integration
