name: Backend Tests and Linters

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check luml migrations tests utils

      - name: Linting
        run: uv run ruff check luml migrations tests utils

      - name: Type checking
        run: uv run mypy luml utils tests

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_VERSION: '1'
      POSTGRESQL_DSN: postgresql+asyncpg://test_user:test_password@localhost:5432/df_studio_test
      AUTH_SECRET_KEY: test_secret_key_for_ci
      BUCKET_SECRET_KEY: 03MWDoMHorc-Ir2qX0F4KT9wrL3V7m5d3KRtwKEhaO0=
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      PYTEST_VERSION: '1'
      POSTGRESQL_DSN: postgresql+asyncpg://test_user:test_password@localhost:5432/df_studio_test
      AUTH_SECRET_KEY: test_secret_key_for_ci
      BUCKET_SECRET_KEY: 03MWDoMHorc-Ir2qX0F4KT9wrL3V7m5d3KRtwKEhaO0=
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: df_studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d df_studio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies with uv
        run: uv sync --locked --group dev

      - name: Run integration tests
        run: uv run pytest tests/integration
