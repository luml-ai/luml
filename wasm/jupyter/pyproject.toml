[project]
name = "luml-jupyter-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn==0.34.3",
    "jupyterlite==0.8.7",
    "jupyterlite-pyodide-kernel==0.8.7",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3.0.0",
    "pytest>=9.0.3,<10.0.0",
    "ruff>=0.14.5,<1.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
