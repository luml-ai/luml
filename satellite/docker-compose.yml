networks:
  satellite-network:
    driver: bridge
    labels:
      df.model-access: "true"
  store-network:
    driver: bridge
    internal: true

volumes:
  greptimedb-data:

services:
  greptimedb:
    image: greptime/greptimedb:v0.13.1
    command:
      - standalone
      - start
      - --http-addr=0.0.0.0:4000
      - --rpc-addr=0.0.0.0:4001
      - "--user-provider=static_user_provider:cmd:${GREPTIMEDB_USERNAME:?Set GREPTIMEDB_USERNAME in .env}=${GREPTIMEDB_PASSWORD:?Set GREPTIMEDB_PASSWORD in .env}"
    networks:
      - store-network
    volumes:
      - greptimedb-data:/tmp/greptimedb
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - satellite-network
      - store-network
    environment:
      GREPTIMEDB_USERNAME: ${GREPTIMEDB_USERNAME:?Set GREPTIMEDB_USERNAME in .env}
      GREPTIMEDB_PASSWORD: ${GREPTIMEDB_PASSWORD:?Set GREPTIMEDB_PASSWORD in .env}
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - greptimedb
    restart: unless-stopped

  model-image:
    image: luml-random-svc:latest
    build:
      context: ../model_servers/default
    command: ["true"]
    restart: "no"
    networks:
      - satellite-network

  agent:
    image: luml-satellite-agent:latest
    build:
      context: .
      dockerfile: implementations/docker/Dockerfile
    networks:
      satellite-network:
        # Model containers call the Agent by this name. Without the alias only
        # "agent" and "satellite-agent-1" resolve, and the URL they are given does not.
        aliases:
          - satellite-agent
      store-network:
    environment:
      SATELLITE_TOKEN: ${SATELLITE_TOKEN:?Set SATELLITE_TOKEN in .env}
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:8000}
      BASE_URL: ${BASE_URL:-http://localhost}
      MODEL_IMAGE: ${MODEL_IMAGE:-luml-random-svc:latest}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MONITORING_ENABLED: "true"
      GREPTIMEDB_HOST: greptimedb
      GREPTIMEDB_USERNAME: ${GREPTIMEDB_USERNAME:?Set GREPTIMEDB_USERNAME in .env}
      GREPTIMEDB_PASSWORD: ${GREPTIMEDB_PASSWORD:?Set GREPTIMEDB_PASSWORD in .env}
      MONITORING_FRAME_ANCESTORS: ${MONITORING_FRAME_ANCESTORS:-http://localhost:5173}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    user: "0:0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:8000"
    depends_on:
      - model-image
      - otel-collector
    restart: unless-stopped
