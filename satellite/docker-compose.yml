networks:
  satellite-network:
    driver: bridge
  docker-control:
    internal: true
    labels:
      df.satellite.private: "true"

volumes:
  greptimedb-data:

services:
  greptimedb:
    image: greptime/greptimedb:v0.13.1
    command: standalone start --http-addr=0.0.0.0:4000 --rpc-addr=0.0.0.0:4001
    networks:
      - satellite-network
    volumes:
      - greptimedb-data:/tmp/greptimedb
    ports:
      - "4000:4000"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - satellite-network
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - greptimedb
    restart: unless-stopped

  model-image:
    image: luml-random-svc:latest
    build:
      context: ../model_servers/default
    command: ["true"]
    restart: "no"
    networks:
      - satellite-network

  reverse-proxy:
    image: nginx:1.28-alpine
    networks:
      - satellite-network
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:80:8080"
    depends_on:
      - agent
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    networks:
      - docker-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      POST: "1"
      PING: "1"
      VERSION: "1"
      EVENTS: "0"
    restart: unless-stopped

  agent:
    image: luml-satellite-agent:latest
    build:
      context: .
      dockerfile: implementations/docker/Dockerfile
    networks:
      satellite-network:
        # Model containers call the Agent by this name. Without the alias only
        # "agent" and "satellite-agent-1" resolve, and the URL they are given does not.
        aliases:
          - satellite-agent
      docker-control:
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      SATELLITE_TOKEN: ${SATELLITE_TOKEN:?Set SATELLITE_TOKEN in .env}
      PLATFORM_URL: ${PLATFORM_URL:-http://localhost:8000}
      BASE_URL: ${BASE_URL:-http://localhost}
      MODEL_IMAGE: ${MODEL_IMAGE:-luml-random-svc:latest}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-2}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      MONITORING_ENABLED: "true"
      GREPTIMEDB_HOST: greptimedb
      MONITORING_FRAME_ANCESTORS: ${MONITORING_FRAME_ANCESTORS:-http://localhost:5173}
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - docker-socket-proxy
      - model-image
      - otel-collector
    restart: unless-stopped
