[project]
name = "luml-satellite"
version = "0.1.0"
description = "Toolkit for building LUML satellites"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.2,<1.0.0",
    "pydantic>=2.12.4,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.121.2,<1.0.0",
    "uvicorn>=0.38.0,<1.0.0",
]
monitoring = [
    "fastapi>=0.121.2,<1.0.0",
    "opentelemetry-api>=1.43.0,<2.0.0",
    "opentelemetry-sdk>=1.43.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.43.0,<2.0.0",
    "uvicorn>=0.38.0,<1.0.0",
]

[project.scripts]
luml-fake-platform = "luml_satellite.testing.fake_platform:main"
luml-stub-model-server = "luml_satellite.testing.stub_model_server:main"
luml-artifact-fetch = "luml_satellite.artifact_fetch:main"
luml-monitoring-worker = "luml_satellite.monitoring.worker_main:main"
luml-monitoring-dashboard = "luml_satellite.monitoring.dashboard_main:main"
luml-satellite-sidecar = "luml_satellite.serving.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luml_satellite"]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.14.5,<1.0.0",
    "uvicorn>=0.38.0,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
src = ["luml_satellite", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "C4", "SIM", "TID252"]
ignore = [
    "ANN002",
    "ANN003",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["luml_satellite"]
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["luml_satellite", "tests"]
