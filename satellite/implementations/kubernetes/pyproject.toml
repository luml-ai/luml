[project]
name = "luml-satellite-kubernetes"
version = "0.1.0"
description = "Kubernetes implementation of the LUML satellite kit"
requires-python = ">=3.14"
dependencies = [
    "kubernetes-asyncio>=36.1.0,<37.0.0",
    "luml-satellite[monitoring,serving]>=0.1.0",
]

[project.scripts]
luml-satellite-kubernetes = "luml_satellite_kubernetes.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["luml_satellite_kubernetes"]

[tool.uv.sources]
luml-satellite = { path = "../../kit", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2.0.0",
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.14.5,<1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
src = ["luml_satellite_kubernetes", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "C4", "SIM", "TID252"]
ignore = ["ANN002", "ANN003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
known-first-party = ["luml_satellite_kubernetes"]
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["luml_satellite_kubernetes", "tests"]

