apiVersion: v1
kind: Pod
metadata:
  name: network-probe
  labels:
    app: network-probe
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: __RUN_AS_USER__
    fsGroup: __FS_GROUP__
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: luml-e2e/stub-model:local
      imagePullPolicy: Never
      command: ["python", "-c", "import time; time.sleep(3600)"]
      securityContext:
        runAsNonRoot: true
        runAsUser: __RUN_AS_USER__
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
