{{- $storage := .Values.monitoring.store.objectStorage -}}
{{- $accessSet := not (empty $storage.accessKey) -}}
{{- $secretSet := not (empty $storage.secretKey) -}}
{{- if and $storage.enabled (ne $accessSet $secretSet) -}}
{{- fail "monitoring.store.objectStorage.accessKey and secretKey must be set together" -}}
{{- end -}}
{{- if and .Values.monitoring.enabled (eq .Values.monitoring.store.mode "standalone") $storage.enabled (not $storage.existingSecret) $accessSet }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "luml.objectStorageSecretName" . | quote }}
  labels:
    {{- include "luml.labels" (dict "root" . "component" "store") | nindent 4 }}
type: Opaque
stringData:
  access-key: {{ $storage.accessKey | quote }}
  secret-key: {{ $storage.secretKey | quote }}
{{- end }}
