{{- if .Values.networkPolicy.enabled }}
{{- $policy := .Values.networkPolicy | default dict }}
{{- $apiServerPort := 6443 }}
{{- if hasKey $policy "apiServerPort" }}
{{- $apiServerPort = $policy.apiServerPort }}
{{- end }}
{{- if gt (int $apiServerPort) 0 }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-satellite" (include "luml.fullname" .) | quote }}
  labels:
    {{- include "luml.labels" (dict "root" . "component" "network-policy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "luml.selectorLabels" (dict "root" . "component" "satellite") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: {{ $apiServerPort }}
{{- end }}
{{- end }}
