suite: chart-managed secrets
templates:
  - templates/secret-token.yaml
  - templates/secret-derivation.yaml
  - templates/secret-monitoring.yaml
release:
  name: secrets
  namespace: models
set:
  satellite.token: test-token
tests:
  - it: creates a separate retained derivation key
    template: templates/secret-derivation.yaml
    asserts:
      - equal:
          path: metadata.name
          value: secrets-luml-satellite-kubernetes-derivation-key
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: stringData.derivation-key
          pattern: ^[A-Za-z0-9]{64}$

  - it: creates a token secret only on the chart-managed path
    template: templates/secret-token.yaml
    asserts:
      - equal:
          path: stringData.satellite-token
          value: test-token

  - it: leaves token creation to the operator on the existing-secret path
    template: templates/secret-token.yaml
    set:
      satellite.existingSecret: operator-token
    asserts:
      - hasDocuments:
          count: 0

  - it: creates the configured monitoring session secret
    template: templates/secret-monitoring.yaml
    set:
      monitoring.sessionSecret: session-secret
    asserts:
      - equal:
          path: stringData.session-secret
          value: session-secret

  - it: derives the monitoring session secret when none is configured
    template: templates/secret-monitoring.yaml
    asserts:
      - hasDocuments:
          count: 0
