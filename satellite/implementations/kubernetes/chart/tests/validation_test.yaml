suite: chart value validation
templates:
  - templates/deployment-satellite.yaml
  - templates/configmap-collector.yaml
  - templates/secret-store.yaml
  - templates/secret-object-storage.yaml
set:
  satellite.token: test-token
  satellite.derivationKey: test-derivation-key
tests:
  - it: rejects external mode without a host
    template: templates/configmap-collector.yaml
    set:
      monitoring.store.mode: external
    asserts:
      - failedTemplate:
          errorMessage: monitoring.store.host is required in external mode

  - it: rejects incomplete direct store credentials
    template: templates/secret-store.yaml
    set:
      monitoring.store.username: user
    asserts:
      - failedTemplate:
          errorMessage: monitoring.store.username and monitoring.store.password must be set together

  - it: rejects incomplete direct object storage credentials
    template: templates/secret-object-storage.yaml
    set:
      monitoring.store.objectStorage.enabled: true
      monitoring.store.objectStorage.accessKey: access
    asserts:
      - failedTemplate:
          errorMessage: monitoring.store.objectStorage.accessKey and secretKey must be set together

  - it: rejects a sidecar cache TTL that conflicts with refresh ahead
    template: templates/deployment-satellite.yaml
    set:
      sidecar.cacheTtlSeconds: 15
    asserts:
      - failedTemplate:
          errorPattern: sidecar.cacheTtlSeconds

  - it: rejects an unknown security preset
    template: templates/deployment-satellite.yaml
    set:
      podSecurity.preset: unknown
    asserts:
      - failedTemplate:
          errorPattern: podSecurity.preset

  - it: rejects a probe timeout below one second
    template: templates/deployment-satellite.yaml
    set:
      probes.timeoutSeconds: 0
    asserts:
      - failedTemplate:
          errorPattern: probes.timeoutSeconds

  - it: rejects a non-numeric probe failure threshold
    template: templates/deployment-satellite.yaml
    set:
      probes.failureThreshold: many
    asserts:
      - failedTemplate:
          errorPattern: probes.failureThreshold

  - it: rejects a non-numeric API server port instead of dropping the rule
    template: templates/deployment-satellite.yaml
    set:
      networkPolicy.apiServerPort: six-four-four-three
    asserts:
      - failedTemplate:
          errorPattern: networkPolicy.apiServerPort

  - it: rejects an API server port outside the port range
    template: templates/deployment-satellite.yaml
    set:
      networkPolicy.apiServerPort: 70000
    asserts:
      - failedTemplate:
          errorPattern: networkPolicy.apiServerPort
