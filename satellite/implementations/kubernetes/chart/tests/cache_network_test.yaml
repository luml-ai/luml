suite: release isolation cache and network policy
templates:
  - templates/pvc-cache.yaml
  - templates/networkpolicy.yaml
release:
  name: first
  namespace: shared
set:
  satellite.token: test-token
  satellite.derivationKey: test-derivation-key
tests:
  - it: creates a release-scoped cache claim with configured access modes
    template: templates/pvc-cache.yaml
    set:
      sharedCache.enabled: true
      sharedCache.size: 50Gi
      sharedCache.storageClass: distributed
      sharedCache.accessModes:
        - ReadWriteMany
        - ReadOnlyMany
    asserts:
      - equal:
          path: metadata.name
          value: first-luml-satellite-kubernetes-model-cache
      - equal:
          path: spec.storageClassName
          value: distributed
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
      - equal:
          path: spec.accessModes
          value: [ReadWriteMany, ReadOnlyMany]

  - it: does not create a claim when an existing one is selected
    template: templates/pvc-cache.yaml
    set:
      sharedCache.enabled: true
      sharedCache.existingClaim: operator-cache
    asserts:
      - hasDocuments:
          count: 0

  - it: defaults deny to this release label while allowing model external egress
    template: templates/networkpolicy.yaml
    asserts:
      - equal:
          path: metadata.name
          value: first-luml-satellite-kubernetes
      - equal:
          path: spec.podSelector.matchLabels["luml.ai/satellite-id"]
          value: first
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["luml.ai/satellite-id"]
          value: first
      - contains:
          path: spec.egress[2].ports
          content: {protocol: TCP, port: 80}
      - contains:
          path: spec.egress[2].ports
          content: {protocol: TCP, port: 443}

  - it: adds only the configured external store port to external egress
    template: templates/networkpolicy.yaml
    set:
      monitoring.store.mode: external
      monitoring.store.host: greptime.example.test
      monitoring.store.port: 4444
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 4
      - contains:
          path: spec.egress[3].ports
          content: {protocol: TCP, port: 4444}

  - it: scopes a second release to a different name and selector
    template: templates/networkpolicy.yaml
    release:
      name: second
      namespace: shared
    asserts:
      - equal:
          path: metadata.name
          value: second-luml-satellite-kubernetes
      - equal:
          path: spec.podSelector.matchLabels["luml.ai/satellite-id"]
          value: second

  - it: quotes a release name that YAML would otherwise treat as a boolean
    template: templates/networkpolicy.yaml
    release:
      name: "true"
      namespace: shared
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["luml.ai/satellite-id"]
          value: "true"
      - equal:
          path: spec.ingress[0].from[0].podSelector.matchLabels["luml.ai/satellite-id"]
          value: "true"
      - equal:
          path: spec.egress[0].to[0].podSelector.matchLabels["luml.ai/satellite-id"]
          value: "true"
