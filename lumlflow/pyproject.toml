[project]
name = "lumlflow"
version = "0.1.0"
description = "Local ML experiment tracking and model management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "typer>=0.15.0,<1.0.0",
    "luml-sdk>=0.2.0,<0.3.0",
    "luml-api>=0.2.0,<0.3.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.0",
    "keyring>=25.0.0",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
    "websockets>=17.0.1",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
tui = [
    "textual>=8.2.7",
    "textual-plotext>=1.0.1",
]

[dependency-groups]
dev = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
    "typer>=0.15.0,<1.0.0",
    "luml-sdk>=0.2.0,<0.3.0",
    "luml-api>=0.2.0,<0.3.0",
    "pydantic-settings>=2.12.0",
    "httpx>=0.28.0",
    "keyring>=25.0.0",
    "textual>=8.2.7",
    "textual-plotext>=1.0.1",
    "hatchling>=1.27.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260724",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[project.scripts]
lumlflow = "lumlflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# `lumlflow/static/` is the compiled web app — a build output, gitignored, and
# so invisible to hatchling's VCS-aware file selection. `artifacts` is the
# documented override for exactly that, and it applies to every target, so the
# sdist and the wheel both carry the bundle. Without it the sdist ships no web
# app and the wheel pip builds from that sdist silently serves an API-only UI.
artifacts = ["/lumlflow/static/**"]

[tool.hatch.build.targets.sdist]
# The bundle above already makes the sdist self-contained, so it ships no
# frontend sources: a source install has no npm workspace root to compile them
# with, and their presence would only push the build hook onto its error path.
exclude = ["/frontend", "/node_modules"]

[tool.hatch.build.targets.wheel]
# The kernel is a separate top-level package in the same wheel: the daemon
# path-injects it into the workspace venv, which holds no lumlflow code.
# `lumlflow_typing` rides along — TYPE_CHECKING-only stubs a scaffolded cell's
# conformance footer checks against, carrying no runtime code either.
packages = ["lumlflow", "lumlflow_kernel", "lumlflow_typing"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py312"
line-length = 88
indent-width = 4
src = ["lumlflow"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call-valued defaults; that is the framework's
# spelling, not a mutable default waiting to bite.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.isort]
# The kernel is a second top-level package of this project, not a dependency.
known-first-party = ["lumlflow_kernel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# The luml SDK ships without a py.typed marker; treat its imports as
# untyped instead of erroring on every `from luml...` import.
[[tool.mypy.overrides]]
module = "luml.*"
ignore_missing_imports = true

# The serde libraries the kernel's kinds import lazily belong to the workspace
# venv, not to this project — they may not be installed here at all.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "polars.*", "cloudpickle.*"]
ignore_missing_imports = true

# The build backend is a build-time dependency, absent from the runtime env
# the checker runs in.
[[tool.mypy.overrides]]
module = "hatchling.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]
luml-sdk = { path = "../sdk/python/sdk", editable = true }
luml-api = { path = "../sdk/python/api", editable = true }
